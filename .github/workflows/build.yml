name: build

# Solo a mano o con [build] en el mensaje del commit.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  reference:
    # Compila la referencia MIPS desde la decomp externa (repos en variables del repo).
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream sources
        env:
          DECOMP_REPO: ${{ vars.DECOMP_REPO }}
          DECOMP_COMMIT: ${{ vars.DECOMP_COMMIT }}
          SDK_REPO: ${{ vars.SDK_REPO }}
        run: |
          test -n "$DECOMP_REPO" && test -n "$SDK_REPO" || { echo "Faltan variables DECOMP_REPO/SDK_REPO"; exit 1; }
          git clone --filter=blob:none "$DECOMP_REPO" upstream/decomp
          git -C upstream/decomp checkout "$DECOMP_COMMIT"
          git clone --depth 1 "$SDK_REPO" upstream/sdk

      - name: Cache apt (wine)
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-wine-ubuntu2404-v1

      - name: Install toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          mkdir -p ~/apt-cache
          sudo apt-get install -y -q -o dir::cache::archives="$HOME/apt-cache" wine wine32 ninja-build
          sudo chown -R "$USER" ~/apt-cache
          pip install -r upstream/decomp/build/requirements.txt

      - name: Build reference executable
        working-directory: upstream/decomp/build
        run: |
          python build.py --psyq_path "$GITHUB_WORKSPACE/upstream/sdk"
          find .. -path ../source -prune -o -type f \( -name '*.exe' -o -name 'SLPM*' \) -newer build.py -print | head

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-build-log
          path: upstream/decomp/obj/**/*.map
          if-no-files-found: ignore
